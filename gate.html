<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8">
<meta name="robots" content="noindex,nofollow">
<title>Zenith</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
  html, body { margin: 0; min-height: 100%; background: #f5ead8; color: #3b2f27; }
  body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
  form {
    width: 100%; max-width: 22rem; background: #fff; border-radius: 20px;
    padding: 28px 24px 24px; box-shadow: 0 12px 40px rgba(59, 47, 39, 0.08);
  }
  img { display: block; width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 16px; }
  h1 { font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 1.75rem; text-align: center; margin: 0 0 8px; }
  .lead { margin: 0 0 20px; text-align: center; line-height: 1.45; color: #6b5c50; }
  label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px;
    border: 1px solid #d9cbb8; border-radius: 12px; background: #fffaf3; color: #3b2f27;
  }
  button {
    width: 100%; margin-top: 16px; font-size: 16px; font-weight: 700; padding: 12px 14px;
    border: 0; border-radius: 12px; background: #c45c3e; color: #fff; cursor: pointer;
  }
  .err { display: none; margin: 12px 0 0; text-align: center; color: #9b2c1a; }
  .err.show { display: block; }
</style>
</head>
<body>
<form method="post" action="/gate">
  <img src="/apple-touch-icon.png" width="72" height="72" alt="">
  <h1>Zenith</h1>
  <p class="lead">Zadaj heslo. Potom uvidíš obsah.</p>
  <label for="heslo">Heslo</label>
  <input id="heslo" name="heslo" type="password" autocomplete="current-password" required>
  <button type="submit">Otvoriť</button>
  <p class="err" id="err">Heslo nesedí. Skús znova.</p>
</form>
<script>
  if (location.search.indexOf("err=1") !== -1) document.getElementById("err").classList.add("show");
</script>
</body>
</html>
